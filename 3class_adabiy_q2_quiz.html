<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-класс Адабий окуу — жыйынтык тест</title><style>body{font-family:Arial,sans-serif;background:#f3f7fb;color:#263445;line-height:1.65;margin:0}.wrap{width:min(900px,92%);margin:auto}.hero{background:#153c63;color:white;padding:28px 0}.card{background:white;padding:20px;border-radius:14px;margin:20px 0}.q{padding:14px 0;border-bottom:1px solid #ddd}.q button{display:block;margin:8px 0;padding:10px 14px;border-radius:8px;border:1px solid #b8c5d2;background:#f8fafc;cursor:pointer;text-align:left;width:100%}.feedback{font-weight:bold}.tools button{padding:12px;margin:8px;border-radius:8px;border:0;background:#153c63;color:white;cursor:pointer}@media print{.tools,.hero{display:none}body{background:white}}</style></head><body><header class="wrap" style="padding:16px"><a href="3class_adabiy_q2.html">← Сабактарга кайтуу</a></header><section class="hero"><div class="wrap"><h1>II чейрек — жыйынтык тест</h1><p>3-класс · Адабий окуу · 10 суроо</p></div></section><main class="wrap"><div class="card"><p>Окуучунун аты-жөнү: <input id="studentName" type="text" placeholder="Аты-жөнү" style="padding:8px;width:min(100%,350px)"></p><p>Ар бир суроого бир туура жооп тандаңыз.</p><div id="quiz"></div><div id="result" class="feedback" aria-live="polite"></div><div class="tools"><button onclick="finish()">Тестти жыйынтыктоо</button><button onclick="resetQuiz()">Кайра баштоо</button><button onclick="window.print()">Басып чыгаруу / PDF</button></div></div></main><script>const qs=[["Жомоктун каармандары көбүнчө кандай окуяларды баяндашы мүмкүн?",["Кызыктуу, ойдон чыгарылган окуяларды","Тек гана эсептерди","Жол кыймылынын эрежелерин"],0],["Окуянын негизги оюн табуу үчүн эмнеге көңүл бурабыз?",["Каармандардын аракетине жана окуяга","Тексттин түсүнө","Барактын өлчөмүнө"],0],["Табиятка кам көрүүнүн туура мисалы кайсы?",["Куштарга жем салгыч даярдоо","Бактарды сындыруу","Таштандыларды сууга таштоо"],0],["Эмгек тууралуу чыгарма кандай ойду билдириши мүмкүн?",["Аракет ийгиликке жеткирет","Эмгек керексиз","Башкаларга жардам бербөө"],0],["Достук жана ынтымак деген эмне?",["Биргелешип, бири-бирине жардам берүү","Урушуп, күнөөлөө","Ар ким өзүн гана ойлошу"],0],["Макал-лакаптарды колдонуу эмне үчүн пайдалуу?",["Ойду кыска жана таамай билдирет","Сөздөрдү маанисиз кылат","Окууну токтотот"],0],["Ырды көркөм окууда эмне маанилүү?",["Маанай, үн жана тыныгуу","Өтө тез окуу","Сөздөрдү өткөрүп кетүү"],0],["Каарманга мүнөздөмө берүүдө эмнени далил катары келтиребиз?",["Анын иш-аракеттерин","Китептин мукабасын","Окуучунун кийимин"],0],["Жаңы сөздүн маанисин контексттен кантип табууга болот?",["Сөз турган сүйлөмдү жана айланасындагы текстти окуу","Сөздү өчүрүү","Текстти окубай коюу"],0],["Окуган текстти кыскача айтып берүүдө эмне сакталат?",["Негизги окуялардын ырааты","Бардык сөздөрдү сөзмө-сөз көчүрүү","Окуяга тиешеси жок маалымат"],0]];let chosen={};const el=document.getElementById("quiz");qs.forEach((q,i)=>{let d=document.createElement("div");d.className="q";d.innerHTML="<b>"+(i+1)+". "+q[0]+"</b>";q[1].forEach((o,j)=>{let b=document.createElement("button");b.textContent=o;b.onclick=()=>{chosen[i]=j;Array.from(d.querySelectorAll("button")).forEach(x=>x.disabled=true);b.style.border="2px solid #153c63";};d.appendChild(b);});el.appendChild(d);});window.finish=()=>{let score=qs.reduce((s,q,i)=>s+(chosen[i]===q[2]?1:0),0);let pct=Math.round(score/qs.length*100);let name=document.getElementById("studentName").value.trim()||"Окуучу";let level=score>=9?"Эң жакшы":score>=7?"Жакшы":score>=5?"Канааттандырарлык":"Кайра машыгуу керек";document.getElementById("result").innerHTML="<h2>Тесттин жыйынтыгы</h2><p>Окуучу: "+name+"</p><p>Упай: "+score+" / "+qs.length+"</p><p>Пайыз: "+pct+"%</p><p>Баалоо: "+level+"</p>";};window.resetQuiz=()=>location.reload();</script></body></html>
