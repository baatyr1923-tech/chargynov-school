<!doctype html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Документти көрүү — №35 мектеп</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#18324d}
header{background:linear-gradient(120deg,#12385b,#16845b);color:#fff;padding:16px 22px}
.wrap{max-width:1200px;margin:auto;padding:18px}
h1{font-size:clamp(20px,3vw,30px);margin:0 0 8px}.muted{opacity:.9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
a.btn{display:inline-block;text-decoration:none;background:#12385b;color:white;padding:11px 16px;border-radius:9px;font-weight:bold}
a.btn.alt{background:#16845b}
.viewer{height:calc(100vh - 170px);min-height:460px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 22px #102d4718}
iframe{width:100%;height:100%;border:0}
.note{font-size:14px;color:#5b6c7d}
</style></head><body>
<header><div class="wrap"><h1 id="title">Материалды көрүү</h1><div class="muted">№35 Жумабек Чаргынов атындагы мектеп · 8-класс</div></div></header>
<main class="wrap"><div class="toolbar"><a class="btn" href="8class_engineering_lessons.html">← Сабактарга кайтуу</a><a class="btn alt" id="download" href="#">Файлды жүктөп алуу</a></div>
<div class="viewer"><iframe id="frame" title="Документти көрүү" allowfullscreen></iframe></div>
<p class="note">Эгер көрүү терезеси ачылбаса, «Файлды жүктөп алуу» шилтемесин колдонуңуз.</p></main>
<script>
const params=new URLSearchParams(location.search),file=params.get('file')||'';
const safe=/^[A-Za-z0-9_().% -]+\.(pptx|docx)$/i.test(file);
if(!safe){document.getElementById('title').textContent='Файл табылган жок';document.getElementById('frame').remove();}
else{
 const url=new URL(file,location.href).href;
 document.getElementById('title').textContent=decodeURIComponent(file.replace(/\+/g,' '));
 document.getElementById('download').href=url;
 document.getElementById('frame').src='https://docs.google.com/gview?embedded=1&url='+encodeURIComponent(url);
}
</script></body></html>
