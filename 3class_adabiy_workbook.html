<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-класс — Адабий окуу — жумуш барактары</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;line-height:1.65;color:#263445;background:#f3f7fb;margin:0}.wrap{width:min(900px,94%);margin:auto}.head{background:linear-gradient(135deg,#163b61,#27668b);color:white;padding:25px}.head a{color:white}.controls{padding:18px}.print{padding:10px 16px;background:#176b4b;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.sheet{background:white;margin:18px auto;padding:28px;border-radius:12px;border:1px solid #e2eaf1;break-after:page}.sheet h2{color:#163b61}.label{color:#59758d;font-size:13px;font-weight:bold;letter-spacing:.5px}.lines{border-bottom:1px solid #aaa;min-height:34px;margin:10px 0}.rating{margin-top:22px;border-top:1px dashed #aaa;padding-top:12px}.foot{font-size:12px;color:#728095;margin-top:24px}@media print{body{background:white}.head,.controls{display:none}.sheet{margin:0;padding:14px;border:0;border-radius:0;break-after:page}.sheet:last-child{break-after:auto}.lines{min-height:30px}}</style></head><body><header class="head"><div class="wrap"><h1>Адабий окуу — 3-класс</h1><p>2-чейрек • Окуучу үчүн жумуш барактары</p><a href="3class_adabiy_q2.html">← Сабактарга кайтуу</a></div></header><main class="wrap"><div class="controls"><button class="print" onclick="window.print()">🖨️ Басып чыгаруу / PDF</button><p>Ар бир тема боюнча тапшырмаларды аткарып, жоопторду берилген саптарга жаз. Бул жумуш барактары жалпы темаларга ылайык автордук материал катары даярдалган; расмий КТП менен тактоо талап кылынат.</p></div><div id="sheets"></div></main><script>const data=[["Элдик жомоктор дүйнөсү","Жомоктун каармандарын ата.","Окуянын башталышын, ортосун жана аягын жаз.","Жомоктон алган сабагың:"],["Жакшылык менен жамандык","Каармандын жакшы аракетин белгилеп жаз.","Каармандын туура эмес аракетин түшүндүр.","Сен кандай чечим кабыл алмаксың?"],["Табиятты сүйүү","Табиятты сүрөттөгөн 3 сөз жаз.","Тексттеги негизги ойду жаз.","Табиятты коргоонун 3 жолун жаз."],["Эмгек жана аракет","Эмгекчил каарманды сүрөттөп жаз.","Эмгектин пайдасын түшүндүр.","Өзүң аткарган пайдалуу иш:"],["Достук жана ынтымак","Каармандар кандай жардам беришти?","Достук тууралуу макал жаз.","Досуңа жардам берген учур:"],["Макал-лакаптар","Эки макал жаз.","Бир макалдын маанисин түшүндүр.","Макалды колдонгон кырдаал:"],["Ырды көркөм окуу","Ырдан образдуу сөздөрдү тап.","Ыр кандай маанай жаратты?","Ырды окууда тыныгуу белгилерин көрсөт."],["Кызыктуу окуя","Окуянын башталышын жаз.","Окуянын өнүгүшүн жаз.","Окуянын аягын жаз."],["Каармандын мүнөзү","Каармандын 3 сапатын жаз.","Ар бир сапатка далил келтир.","Каарманга кандай кеңеш бересиң?"],["Сөздөрдүн мааниси","3 түшүнүксүз сөздү жаз.","Эки синоним мисал келтир.","Эки антоним мисал келтир."],["Окуганды айтып берүү","Окуянын негизги каарманы.","Негизги 3 окуяны ирети менен жаз.","5 сүйлөм менен кыскача айтып бер."],["Чейректи жыйынтыктоо","Эң жаккан тема.","Эсте калган каарман жана себеби.","Чейректе үйрөнгөн 3 нерсе."]];document.getElementById("sheets").innerHTML=data.map((d,i)=>'<section class="sheet"><div class="label">ЖУМУШ БАРАГЫ '+(i+1)+' / 12</div><h2>'+(i+1)+'. '+d[0]+'</h2><p>Окуучунун аты-жөнү: _______________________________ &nbsp; Күнү: __________</p>'+d.slice(1).map(x=>'<p><b>'+x+'</b></p><div class="lines"></div><div class="lines"></div><div class="lines"></div>').join("")+'<div class="rating"><b>Өзүмдү баалайм:</b> □ Түшүндүм &nbsp; □ Дагы машыгам &nbsp; □ Жардам керек</div><div class="foot">3-класс • Адабий окуу • 2-чейрек</div></section>').join("");</script></body></html>
