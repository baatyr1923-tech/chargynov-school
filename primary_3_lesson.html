<script>
const lessons = {
1:{title:"Температура жана термометр",desc:"Температура нерсенин же айлана-чөйрөнүн канчалык ысык же муздак экенин көрсөтөт. Аны термометр менен өлчөйбүз. Өлчөө бирдиги — Цельсий градусу (°C).",task:"Термометрдин түзүлүшүн карап, көрсөткүчүн окугула. 12°C, 5°C жана 20°C көрсөткүчтөрүн салыштыргыла.",outcome:"Термометрдин көрсөткүчүн окуп, температураларды салыштыруу."},
2:{title:"Аба ырайы жана аба ырайынын божомолу",desc:"Аба ырайы белгилүү бир убактагы белгилүү жердеги абанын абалы. Аны температура, булуттуулук, жаан-чачын жана шамал мүнөздөйт. Божомол жакынкы убактагы аба ырайы кандай болушу мүмкүн экенин билдирет.",task:"Сүрөттөрдөн аба ырайын сүрөттөгүлө. Божомол эмне үчүн керек экенин талкуулагыла.",outcome:"Аба ырайынын белгилерин атап, божомолдун маанисин түшүндүрүү."},
3:{title:"Аба ырайы жана аба ырайынын божомолу — практикалык иш",desc:"Бүгүнкү аба ырайын терезеден байкагыла: асман, температура, шамал жана жаан-чачын.",task:"Байкоону иш барагына белгилегиле. Шарттуу божомолду окуп, андагы температураны жана жаан-чачынды тапкыла.",outcome:"Байкоо жүргүзүп, аба ырайын 2–3 сүйлөм менен сүрөттөө."},
4:{title:"Биз жаратылышты кантип изилдейбиз",desc:"Жаратылышты байкоо, салыштыруу жана жөнөкөй суроолорго жооп издөө аркылуу изилдейбиз. Байкоодо объекттин белгилерине көңүл бурабыз.",task:"Жаратылыш объектин тандап, анын түсүн, формасын, көлөмүн жана өзгөрүшүн байкагыла.",outcome:"Байкоонун жыйынтыгын оозеки же жазуу түрүндө баяндоо."},
5:{title:"Биз жаратылышты кантип изилдейбиз — практикалык иш",desc:"Практикалык иште объектти байкап, белгилерин салыштырып, жыйынтык чыгарабыз.",task:"Иш барагындагы байкоо тапшырмаларын аткарып, эки объекттин окшоштугун жана айырмасын белгилегиле.",outcome:"Байкоо жана салыштыруу жыйынтыгын жазуу."},
6:{title:"Бизди курчап турган буюмдар (Курчап турган дүйнө)",desc:"Буюмдарды түсү, формасы, көлөмү, жасалган материалы жана колдонулушу боюнча сүрөттөөгө болот.",task:"Класстагы үч буюмду тандап, алардын белгилерин таблицага жазгыла.",outcome:"Буюмдун кеминде үч белгисин атап берүү."},
7:{title:"Буюмдар кантип топтоштурулат",desc:"Буюмдарды жалпы белгилерине жараша топторго бөлөбүз. Бир эле буюм ар башка белгилери боюнча ар башка топко кириши мүмкүн.",task:"Карточкаларды материалы, формасы же колдонулушу боюнча топтоштургула. Эмне үчүн мындай бөлгөнүңөрдү түшүндүргүлө.",outcome:"Топтоштуруунун негизин так айтып берүү."},
8:{title:"Тирүү организмдердин касиеттери",desc:"Тирүү организмдер азыктанат, дем алат, өсөт жана өнүгөт, көбөйөт, айлана-чөйрөдөгү өзгөрүүлөргө жооп берет.",task:"Өсүмдүк менен ташты салыштырып, кайсынысы тирүү организм экенин жана себебин түшүндүргүлө.",outcome:"Тирүү организмдин касиеттерин атап, жансыз нерседен айырмалоо."},
9:{title:"Тирүү организмдердин касиеттери — практикалык иш",desc:"Өсүмдүктү байкап, жалбырагын, сабагын жана башка көрүнгөн белгилерин сүрөттөйбүз. Андан соң жансыз нерсе менен салыштырабыз.",task:"Иш барагындагы байкоо жана салыштыруу тапшырмаларын аткаргыла. Тирүү организмдин касиеттерине мисал келтиргиле.",outcome:"Байкоо жүргүзүп, жөнөкөй тыянак чыгаруу."},
10:{title:"Жаныбарлар. Жаныбарлардын ар кандай топтору",desc:"Жаныбарлардын негизги топторуна сүт эмүүчүлөр, канаттуулар, балыктар, курт-кумурскалар жана сойлоочулар кирет.",task:"Уй, бүркүт, сазан, көпөлөк жана ташбаканы тиешелүү топторго бөлгүлө.",outcome:"Ар бир топко мисал келтирүү."},
11:{title:"Жаныбарлардын ар кандай топтору — практикалык иш",desc:"Жаныбарларды белгилерине карап топтоштурабыз. Ошондой эле үй жана жапайы жаныбарларды айырмалайбыз.",task:"Жылкы, бүркүт, чабак, аары жана кескелдирикти топторго бөлгүлө. Тандооңорду түшүндүргүлө.",outcome:"Жаныбарларды туура топтоштуруп, негизин түшүндүрүү."},
12:{title:"Жашоо циклдери",desc:"Жашоо цикли — тирүү организмдин жашоосундагы өзгөрүү жана өнүгүү этаптары. Көпөлөк: жумуртка → курт → куурчак → чоң көпөлөк.",task:"Көпөлөктүн этаптарын ирети менен айтып, өсүмдүктүн үрөндөн өнүгүшүнө мисал келтиргиле.",outcome:"Жашоо циклинин этаптарын туура иреттөө."},
13:{title:"Жашоо циклдери — практикалык иш",desc:"Көпөлөктүн жана өсүмдүктүн өнүгүү этаптарын иреттеп, окшоштуктарын жана айырмачылыктарын салыштырабыз.",task:"Карточкаларды туура иретке келтиргиле. Эки жашоо циклинин бир окшоштугун жана бир айырмасын жазгыла.",outcome:"Эки жашоо циклин салыштырып, жыйынтык чыгаруу."},
14:{title:"Азык чынжырлары",desc:"Азык чынжыры организмдердин азыктануу аркылуу байланышуу тартибин көрсөтөт. Мисал: чөп → коён → түлкү. Жебе азык/энергиянын өтүү багытын көрсөтөт.",task:"Карточкалардан чөп → коён → түлкү жана дан → чычкан → үкү чынжырларын түзгүлө.",outcome:"Жөнөкөй азык чынжырын түзүп, организмдердин байланышын түшүндүрүү."}
};
const id=Number(new URLSearchParams(location.search).get("lesson"));
const item=lessons[id];
if(item){
 document.title=id+"-сабак. "+item.title+" | №35 мектеп";
 document.getElementById("title").textContent=id+"-сабак. "+item.title;
 document.getElementById("subtitle").textContent="Сабактын түшүндүрмөсү, тапшырмасы жана күтүлүүчү натыйжасы";
 document.getElementById("lesson").innerHTML='<h2>Кыскача түшүндүрмө</h2><p>'+item.desc+'</p><h2>Окуучунун тапшырмасы</h2><p>'+item.task+'</p><h2>Күтүлүүчү натыйжа</h2><p>'+item.outcome+'</p><div class="notice" id="materialsNotice"></div>';
 const materialsNotice=document.getElementById("materialsNotice");
 if(id===1){
  materialsNotice.className="actions";
  materialsNotice.innerHTML='<a class="btn" href="3_klass_temperatura_sabak_plan.html">Толук сабактын иштелмесин ачуу</a> <a class="btn" href="3_klass_temperatura_prezentatsiya.html">Презентацияны ачуу</a>';
 }else if(id===2){
  materialsNotice.className="actions";
  materialsNotice.innerHTML='<a class="btn" href="3_klass_aba_yrayy_sabak_plan.html">Толук сабактын иштелмесин ачуу</a> <a class="btn" href="3_klass_aba_yrayy_prezentatsiya.html">Презентацияны ачуу</a> <a class="btn" href="3_klass_aba_yrayy_ish_baragy.html">Окуучунун иш барагын ачуу</a>';
 }else if(id>=3 && id<=14){
  materialsNotice.className="actions";
  const resourcePage="3_klass_sabak_"+id+"_materialdary.html";
  materialsNotice.innerHTML='<a class="btn" href="'+resourcePage+'#plan">Толук сабактын иштелмеси</a> <a class="btn" href="'+resourcePage+'#slides">Презентация</a> <a class="btn" href="'+resourcePage+'#worksheet">Окуучунун иш барагы</a>';
 }else{
  materialsNotice.textContent="Бул сабактын материалдары даярдалууда.";
 }
}else{
 document.getElementById("lesson").innerHTML='<h2>Сабак табылган жок</h2><p>Сабактардын тизмесинен керектүү теманы тандаңыз.</p>';
}
</script></body></html>
