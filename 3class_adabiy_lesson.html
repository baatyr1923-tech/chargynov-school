<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-класс — Адабий окуу</title><style>body{font-family:Arial,sans-serif;line-height:1.7;background:#f3f7fb;color:#263445;margin:0}.wrap{width:min(900px,92%);margin:auto}.hero{background:#153c63;color:white;padding:30px 0}.card{background:white;border-radius:12px;padding:20px;margin:20px 0}.q{padding:12px;border-top:1px solid #ddd}.q button{margin:5px;padding:8px 12px;border:1px solid #bbb;border-radius:8px;background:#f8fafc;cursor:pointer}.note{background:#fff7e6;padding:12px;border-radius:8px}.self button{padding:10px 14px;margin:6px;border-radius:9px;border:1px solid #bbb;background:#f8fafc;cursor:pointer}.selfresult{font-weight:bold;margin-top:10px}.navrow{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.navrow a,.navrow button{padding:10px 14px;border-radius:9px;background:#153c63;color:white;text-decoration:none;border:0;cursor:pointer}.progress{padding:12px;background:#e8f1fa;border-radius:8px;margin:12px 0}.printbtn{padding:10px 14px;border-radius:9px;border:1px solid #bbb;background:#f8fafc;cursor:pointer;margin:5px}.lessonjump{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.lessonjump a{display:inline-block;padding:8px 11px;border-radius:8px;background:#e8f1fa;color:#153c63;text-decoration:none;font-weight:bold}.lessonjump a.current{background:#153c63;color:white}@media print{header,.hero,.navrow,.self,.printbtn{display:none!important}body{background:white}.card{border:0}} .mediaBox{margin:20px 0;padding:18px;border:1px solid #dbe5ef;border-radius:14px;background:#f8fbff}.slides{display:none;padding:20px;min-height:170px;border-radius:12px;background:linear-gradient(135deg,#e9f7ef,#e8f1ff)}.slides.active{display:block}.slideControls button{padding:9px 14px;margin:6px;border:0;border-radius:8px;background:#153c63;color:#fff;cursor:pointer}.forestAnim{font-size:42px;display:flex;justify-content:space-around;align-items:center;overflow:hidden;padding:12px}.fox{display:inline-block;animation:foxmove 3s ease-in-out infinite alternate}.bird{display:inline-block;animation:birdmove 2s ease-in-out infinite alternate}@keyframes foxmove{from{transform:translateX(-20px)}to{transform:translateX(20px)}}@keyframes birdmove{from{transform:translateY(8px)}to{transform:translateY(-12px)}}</style></head><body><header class="wrap" style="padding:18px"><a href="3class_adabiy_q2.html">← Сабактар</a> | <a href="3class_adabiy_workbook.html">Жумуш барактары</a></header><section class="hero"><div class="wrap"><h1 id="title">Сабак</h1></div></section><main class="wrap"><article class="card" id="content"></article></main><script>
const lessons=[
{title:"Элдик жомоктор дүйнөсү",heading:"Акылдуу түлкү",passage:"Бир күнү түлкү токойдон азык издеп жүрүп, дарактын түбүндө жаткан нанды көрдү. Ал нанды дароо жебей, жанындагы ачка торгойлорго бөлүп берди. Торгойлор түлкүгө ыраазы болушту. Түлкү болсо бөлүшкөндө кубаныч көбөйөрүн түшүндү.",qs:[{q:"Түлкү токойдо эмнени көрдү?",opts:["Дарактын түбүндөгү нанды","Күмүш шакекти","Кызыл топту"],answer:0},{q:"Түлкү нанды кимдер менен бөлүштү?",opts:["Торгойлор менен","Карышкырлар менен","Балыктар менен"],answer:0},{q:"Жомоктон кандай ой алабыз?",opts:["Бөлүшүү жана жардам берүү жакшы","Ар дайым жалгыз болуу керек","Тамакты жашырып коюу керек"],answer:0}]},
{title:"Жакшылык менен жамандык",heading:"Жакшы иш",passage:"Айылдагы Айдана жолдон адашып калган кичинекей баланы көрдү. Ал баладан кайда жашарын сурап, чоңдорго кабар берди. Көп өтпөй бала үй-бүлөсүнө жетти. Айдананын жакшы иши баарына үлгү болду.",qs:[{q:"Айдана кимди көрдү?",opts:["Адашкан баланы","Карыган атты","Коңшу итти"],answer:0},{q:"Айдана эмне кылды?",opts:["Чоңдорго кабар берди","Баланы жалгыз калтырды","Үйүнө качып кетти"],answer:0},{q:"Айдананын иши кандай?",opts:["Жакшы жана жардамчы","Кайдыгер","Ачуулуу"],answer:0}]},
{title:"Табиятты сүйүү",heading:"Куштарга камкордук",passage:"Кыш келгенде бактагы куштарга азык табуу кыйын болду. Эрмек менен эжеси жыгачтан жем салгыч жасап, ага дан салышты. Күн сайын жем салгычты текшерип турушту. Куштар суукта азыксыз калбады.",qs:[{q:"Куштарга кайсы мезгилде азык табуу кыйын?",opts:["Кышында","Жайында","Күздүн башында"],answer:0},{q:"Балдар эмне жасашты?",opts:["Жем салгыч","Кайык","Китеп текчеси"],answer:0},{q:"Балдардын аракетинин максаты?",opts:["Куштарга кам көрүү","Куштарды коркутуу","Дарактарды кыйуу"],answer:0}]},
{title:"Эмгек жана аракет",heading:"Кичинекей сүрөтчү",passage:"Мээрим сүрөт тартууну жакшы көрчү, бирок алгач анын сүрөттөрү ойдогудай чыкчу эмес. Ал күн сайын бир аздан машыкты. Бир айдан кийин мектептеги көргөзмөгө анын сүрөтү коюлду. Мээрим аракет кылса, ийгиликке жетерин билди.",qs:[{q:"Мээрим эмнеге машыкты?",opts:["Сүрөт тартууга","Бийикке секирүүгө","Ыр айтууга"],answer:0},{q:"Ал канча убакыт машыкты?",opts:["Күн сайын","Бир гана жолу","Машыккан жок"],answer:0},{q:"Окуянын негизги ой?",opts:["Аракет ийгиликке жеткирет","Талант гана маанилүү","Ката кетирбөө үчүн аракет кылбоо керек"],answer:0}]},
{title:"Достук жана ынтымак",heading:"Жоголгон топ",passage:"Балдар короодо топ ойноп жатышты. Топ тосмонун ары жагына түшүп калды. Алар бири-бирин күнөөлөбөй, кошунадан жардам сурашты. Кошуна топту алып берди. Балдар ынтымак менен иш кылганда маселе оңой чечилерин түшүнүштү.",qs:[{q:"Топ кайда түшүп калды?",opts:["Тосмонун ары жагына","Сууга","Мектептин ичинде"],answer:0},{q:"Балдар кандай чечим кабыл алышты?",opts:["Кошунадан жардам сурашты","Бири-бири менен урушту","Оюнду унутушту"],answer:0},{q:"Окуя эмнени үйрөтөт?",opts:["Ынтымакта иш кылууну","Күнөөлөөнү","Жалгыз аракет кылууну"],answer:0}]},
{title:"Макал-лакаптар",heading:"Эмгектин жемиши",passage:"Айжан чоң энесине бакчада жардам берди. Ал отоо чөптөрдү жулуп, жашылчаларды сугарды. Күзүндө бакчадан мол түшүм жыйналды. Чоң энеси: «Эмгек кылсаң, өнмөк бар», — деп айтты.",qs:[{q:"Айжан чоң энесине кайда жардам берди?",opts:["Бакчада","Китепканада","Дүкөндө"],answer:0},{q:"Бакчада эмне кылды?",opts:["Отоо чөп жулуп, сугарды","Китеп окуп жатты","Оюнчук жасады"],answer:0},{q:"Макалдын мааниси?",opts:["Эмгек жакшы натыйжа берет","Эмгектен качуу керек","Түшүм өзүнөн өзү келет"],answer:0}]},
{title:"Ырды көркөм окуу",heading:"Таңкы бак",passage:"Таң атты, күн нур чачты,\nБак ичинде куш сайрады.\nГүлдөр жайнап, жел терметип,\nЖаңы күнгө шаттанды.",qs:[{q:"Ырда күн качан чыкты?",opts:["Таңда","Түндө","Кечинде"],answer:0},{q:"Бак ичинде эмне сайрады?",opts:["Куш","Коңгуроо","Балдар"],answer:0},{q:"Ыр кандай маанай жаратат?",opts:["Көңүлдүү, жарык","Коркунучтуу","Кайгылуу"],answer:0}]},
{title:"Кызыктуу окуя",heading:"Куттуктоо картасы",passage:"Нурия досу Саматтын туулган күнүнө куттуктоо картасын өзү жасады. Картага жылуу сөздөрдү жазып, кооз сүрөт тартты. Самат белекти көрүп кубанды. Ал достун көңүл буруусу баалуу экенин айтты.",qs:[{q:"Нурия кимге карта жасады?",opts:["Саматка","Мугалимге","Чоң атасына"],answer:0},{q:"Картага эмне жазды?",opts:["Жылуу куттуктоо сөздөрүн","Тапшырмалардын жоопторун","Дүкөндүн тизмесин"],answer:0},{q:"Самат эмнеге кубанды?",opts:["Досунун көңүл буруусуна","Карта жоголгонуна","Сабак токтогонуна"],answer:0}]},
{title:"Каармандын мүнөзү",heading:"Боорукер коён",passage:"Коён токойдо жаракат алган чымчыкты көрдү. Ал чымчыкты жалгыз калтырбай, үкүгө алып барды. Үкү анын жарасын карап, чымчыкка жардам берди. Коён башка бирөөнүн кайгысын байкабай өтүп кетпеген боорукер каарман болду.",qs:[{q:"Коён кимди көрдү?",opts:["Жаракат алган чымчыкты","Ойноп жүргөн түлкүнү","Уктап жаткан аюуну"],answer:0},{q:"Коён чымчыкты кимге алып барды?",opts:["Үкүгө","Карышкырга","Балыкка"],answer:0},{q:"Коён кандай каарман?",opts:["Боорукер","Кайдыгер","Тентек"],answer:0}]},
{title:"Сөздөрдүн мааниси",heading:"Мээримдүү сөз",passage:"Бекзат китептен «мээримдүү» деген сөздү окуп калды. Ал сүйлөмдөрдү кайра окуп, бул сөз адамдын жылуу мамилесин билдирерин түшүндү. Мээримдүү адам башкаларга боорукер болуп, жардам берүүгө даяр болот.",qs:[{q:"«Мээримдүү» сөзү кандай адамды сүрөттөйт?",opts:["Жылуу мамилелүү адамды","Катуу үндүү адамды","Тез чуркаган адамды"],answer:0},{q:"Бекзат сөздүн маанисин кантип түшүндү?",opts:["Сүйлөмдөрдү кайра окуп","Сөздү өчүрүп","Сүрөттү гана карап"],answer:0},{q:"«Мээримдүү» сөзүнө жакын сөз?",opts:["Боорукер","Кайдыгер","Ачуулуу"],answer:0}]},
{title:"Окуганды айтып берүү",heading:"Китепканадагы окуу",passage:"Лейла китепканада жаныбарлар жөнүндө кызыктуу китеп окуду. Ал китептен түлкү, коён жана аюу тууралуу маалымат алды. Үйгө келгенде окуганын инисине айтып берди. Иниси да китеп окууга кызыкты.",qs:[{q:"Лейла кайда китеп окуган?",opts:["Китепканада","Стадиондо","Базарда"],answer:0},{q:"Китеп эмне жөнүндө болгон?",opts:["Жаныбарлар жөнүндө","Математика жөнүндө","Космос кемелери жөнүндө"],answer:0},{q:"Лейла үйдө эмне кылды?",opts:["Окуганын инисине айтып берди","Китепти жыртты","Китепти жашырды"],answer:0}]},
{title:"Чейректи жыйынтыктоо",heading:"Окуудан алган сабак",passage:"Чейрек ичинде окуучулар жомок, ыр жана кызыктуу окуяларды окушту. Алар каармандардын жакшы сапаттарын талдап, жаңы сөздөрдү үйрөнүштү. Окуган чыгармалар аларды достукка, эмгекке жана боорукерликке үндөдү.",qs:[{q:"Окуучулар кандай чыгармаларды окушту?",opts:["Жомок, ыр жана окуяларды","Бир гана эсептерди","Спорттук эрежелерди"],answer:0},{q:"Окуучулар эмнени үйрөнүштү?",opts:["Жаңы сөздөрдү жана каармандарды талдоону","Сүрөттөрдү өчүрүүнү","Оюн гана ойноону"],answer:0},{q:"Чыгармалар кандай сапаттарга үндөдү?",opts:["Достук, эмгек, боорукерлик","Кайдыгерлик жана уруш","Жалкоолук"],answer:0}]}
];
const n=Number(new URLSearchParams(location.search).get("lesson"));const d=lessons[n-1];if(d){document.getElementById("title").textContent=n+"-сабак: "+d.title;let h='<button class="printbtn" onclick="window.print()">🖨️ Басып чыгаруу / PDF</button><h2>'+d.heading+'</h2><p>'+d.passage.replace(/\n/g,'<br>')+'</p><h2>Текстти түшүнүү</h2><div id="score" class="note" aria-live="polite">Азырынча туура жооп: 0 / 3</div>';if(n===1){h+="<section class=\"mediaBox\"><h2>📊 Презентация: Элдик жомоктор дүйнөсү</h2><div id=\"slide1\" class=\"slides active\"><h3>1-слайд. Жомок деген эмне?</h3><p>Жомок — элдин кыялынан жаралган кызыктуу окуя. Жомок бизге жакшы сапаттарды үйрөтөт.</p></div><div id=\"slide2\" class=\"slides\"><h3>2-слайд. «Акылдуу түлкү»</h3><p>Түлкү токойдон азык издеп жүрүп, дарактын түбүндөгү нанды көрдү.</p></div><div id=\"slide3\" class=\"slides\"><h3>3-слайд. Бөлүшүү</h3><p>Түлкү нанды ачка торгойлор менен бөлүштү.</p></div><div id=\"slide4\" class=\"slides\"><h3>4-слайд. Каармандар</h3><p>Түлкү — бөлүшкөндү үйрөнгөн каарман. Торгойлор — анын жардамын алган куштар.</p></div><div id=\"slide5\" class=\"slides\"><h3>5-слайд. Жомоктун сабагы</h3><p>Бөлүшүү, боорукерлик жана жардам берүү — жакшы сапаттар.</p></div><div id=\"slide6\" class=\"slides\"><h3>6-слайд. Ойлонуп көр!</h3><p>Эгер сен түлкү болсоң, нанды ким менен бөлүшмөксүң?</p></div><div class=\"slideControls\"><button onclick=\"slideMove(-1)\">← Артка</button><button onclick=\"slideMove(1)\">Кийинки →</button></div><p id=\"slideCount\">1 / 6</p></section><section class=\"mediaBox\"><h2>🎞️ Анимация: Токойдогу окуя</h2><p>Түлкү торгойлорго жардам берген көрүнүш:</p><div class=\"forestAnim\"><span>🌳</span><span class=\"fox\">🦊</span><span class=\"bird\">🐦</span><span class=\"bird\">🐦</span><span>🍞</span></div><p>Көрүнүштү карап, түлкүнүн эмне кылганын айтып бер.</p></section>";window.slideIndex=1;window.slideMove=(delta)=>{window.slideIndex=Math.max(1,Math.min(6,window.slideIndex+delta));for(let i=1;i<=6;i++)document.getElementById("slide"+i).classList.toggle("active",i===window.slideIndex);document.getElementById("slideCount").textContent=window.slideIndex+" / 6";};}d.qs.forEach((q,i)=>h+='<div class="q"><b>'+q.q+'</b><br>'+q.opts.map((o,j)=>'<button onclick="check('+i+','+j+')">'+o+'</button>').join('')+'<div id="f'+i+'"></div></div>');h+='<h2>Сөздүк иш</h2><p>Тексттен 2 жаңы сөздү танда. Алардын маанисин түшүндүр.</p><h2>Чыгармачылык иш</h2><p>Окуяны 3–4 сүйлөм менен айтып бер же сүрөт тарт.</p><h2>Өзүн-өзү баалоо</h2><div class="self"><p>Бүгүнкү сабакты кандай түшүндүң?</p><button onclick="selfRate(2)">😊 Түшүндүм</button><button onclick="selfRate(1)">😐 Дагы машыгам</button><button onclick="selfRate(0)">🙁 Жардам керек</button><div id="selfresult" class="selfresult" aria-live="polite"></div></div><h2>Мугалимге сунуш</h2><p>Текстти көркөм окуу, сөздүк иш, суроолор боюнча талкуу жана чыгармачылык тапшырма.</p><p class="note">Бул автордук электрондук материал. Окуу китебине жана расмий КТПга дал келиши текшериле элек.</p>';h+='<div class="progress" id="progress"></div><div class="navrow">' +(n>1?'<a href="3class_adabiy_lesson.html?lesson='+(n-1)+'">← Мурунку сабак</a>':'<span>Биринчи сабак</span>')+(n<lessons.length?'<a href="3class_adabiy_lesson.html?lesson='+(n+1)+'">Кийинки сабак →</a>':'<span>Акыркы сабак</span>')+'<button onclick="markDone()">✓ Сабакты өттүм</button></div>';document.getElementById("content").innerHTML=h;window.markDone=()=>{let done=[];try{done=JSON.parse(localStorage.getItem("adabiy3q2done")||"[]")}catch(e){}if(!done.includes(n))done.push(n);localStorage.setItem("adabiy3q2done",JSON.stringify(done));updateProgress();};window.updateProgress=()=>{let done=[];try{done=JSON.parse(localStorage.getItem("adabiy3q2done")||"[]")}catch(e){}done=Array.from(new Set(done.filter(v=>Number.isInteger(v)&&v>=1&&v<=lessons.length)));document.getElementById("progress").textContent="Өтүлгөн сабактар: "+done.length+" / "+lessons.length+" ("+Math.round(done.length/lessons.length*100)+"%)";};updateProgress();const jump=document.createElement("div");jump.className="lessonjump";jump.setAttribute("aria-label","Сабак номерлери");jump.innerHTML=lessons.map((x,i)=>'<a class="'+(i+1===n?"current":"") +'" href="3class_adabiy_lesson.html?lesson='+(i+1)+'">'+(i+1)+'</a>').join("");document.getElementById("progress").after(jump);window.answered={};try{const saved=JSON.parse(localStorage.getItem("adabiy3q2quiz_"+n)||"{}");if(saved&&typeof saved==="object"&&!Array.isArray(saved)){d.qs.forEach((q,i)=>{if(saved[i]===true)window.answered[i]=true;});}}catch(e){};d.qs.forEach((q,i)=>{if(window.answered[i]){const el=document.getElementById("f"+i);if(el){el.textContent="Туура жооп! (сакталган)";el.style.color="green";}}});document.getElementById("score").textContent="Туура жооп: "+Object.keys(window.answered).length+" / "+d.qs.length;window.selfRate=(level)=>{const m=["Мугалим менен кайра карап чыгалы.","Кайра окуп, дагы бир жолу аракет кыл!","Азамат! Сабакты жакшы түшүндүң."];document.getElementById("selfresult").textContent=m[level];};window.check=(qi,oi)=>{let el=document.getElementById("f"+qi);if(window.answered[qi]){el.textContent="Бул суроону сиз мурда туура жооптогонсуз.";el.style.color="green";return;}if(oi===d.qs[qi].answer){el.textContent="Туура жооп!";el.style.color="green";window.answered[qi]=true;localStorage.setItem("adabiy3q2quiz_"+n,JSON.stringify(window.answered));}else{el.textContent="Кайра ойлонуп, текстти оку.";el.style.color="#a45b00";}let count=Object.keys(window.answered).length;document.getElementById("score").textContent="Туура жооп: "+count+" / "+d.qs.length+(count===d.qs.length?" — Азамат! Бардык суроолор туура!":"");};}else document.getElementById("content").textContent="Сабак табылган жок.";
</script></body></html>
