<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-класс — Адабий окуу</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#263445;line-height:1.7}.wrap{width:min(900px,92%);margin:auto}.hero{background:linear-gradient(120deg,#102b50,#20527a);color:#fff;padding:34px 0}.card{background:#fff;border:1px solid #e1e9f0;border-radius:14px;padding:22px;margin:22px 0}h2{color:#102b50}.btn{display:inline-block;padding:10px 15px;border-radius:9px;background:#e8f4ed;color:#16865b;text-decoration:none;font-weight:bold}.actions{display:flex;flex-wrap:wrap;gap:10px}.note{background:#fff7e6;padding:14px;border-radius:8px}</style></head><body><header class="wrap" style="padding:18px 0"><a href="3class_adabiy_q2.html">← Сабактардын тизмеси</a></header><section class="hero"><div class="wrap"><h1 id="title">Сабак</h1><p>3-класс • Адабий окуу • 2-чейрек</p></div></section><main class="wrap"><article class="card" id="content"></article><div class="actions"><a class="btn" href="3class_adabiy_q2.html">Бардык сабактар</a></div></main><script>const data=[["Элдик жомоктор дүйнөсү","Жомок — элдин кыялын, турмуштук тажрыйбасын жана акыл-насаатын чагылдырган чыгарма. Окуганда окуянын башталышын, негизги окуяларын жана аякташын байкайбыз.","Жомоктон башкы каармандарды ата. Окуянын үч негизги бөлүгүн айтып бер."],["Жакшылык менен жамандык","Көркөм чыгарма каармандардын иш-аракеттери аркылуу жакшылык, адилеттүүлүк жана жоопкерчилик жөнүндө ой жүгүртүүгө жардам берет.","Каармандын бир жакшы жана бир туура эмес аракетин талдап, өз оюңду айт."],["Табиятты сүйүү","Табият жөнүндө тексттерде автор өсүмдүктөрдү, жаныбарларды жана айлана-чөйрөнү сүрөттөп, аларды коргоого чакырат.","Тексттен табиятты сүрөттөгөн сөздөрдү терип жаз. Табиятты коргоонун үч жолун ата."],["Эмгек жана аракет","Эмгек тууралуу чыгармалар эмгекчилдик, чыдамкайлык жана аракеттин маанисин көрсөтөт.","Каармандын эмгегин сүрөттөп, эмгек эмне үчүн маанилүү экенин 3 сүйлөм менен жаз."],["Достук жана ынтымак","Достук темасындагы окуяларда жардам берүү, ишеним жана ынтымак маанилүү орунда турат.","Каармандар бири-бирине кандай жардам берди? Достук тууралуу макал айт."],["Макал-лакаптар","Макал-лакаптар кыска сөз менен терең ойду билдирет. Аларды турмуштук кырдаалга ылайык түшүнүү керек.","Тандаган макалыңдын маанисин түшүндүрүп, аны колдонууга боло турган кырдаалды жаз."],["Ырды көркөм окуу","Ырды көркөм окууда тыныгуу, үн ыргагы жана маанайга ылайык интонация колдонулат.","Ырды эки жолу оку. Экинчи окууда маанайын үн менен билдирип, ырдан образдуу сөздөрдү тап."],["Кызыктуу окуя","Окуянын түзүлүшү көбүнчө башталыш, окуянын өнүгүшү жана аяктоо бөлүктөрүнөн турат.","Окуяны ушул үч бөлүккө бөлүп, ар бирине бир сүйлөмдөн жаз."],["Каармандын мүнөзү","Каармандын мүнөзүн анын сөздөрү, аракеттери жана башка каармандар менен мамилеси аркылуу түшүнөбүз.","Каарманга 3 сапат жазып, ар бир сапатка тексттен далил келтир."],["Сөздөрдүн мааниси","Сөздүн маанисин сүйлөмдүн контекстинен аныктоого болот. Синонимдер мааниси жакын, антонимдер карама-каршы сөздөр.","Тексттен 2 синоним жана 2 антоним тап же өзүң мисал түз."],["Окуганды айтып берүү","Кыскача баяндоодо негизги окуялар сакталат, бирок майда-чүйдө маалыматтар кыскартылат.","Текстти 5 сүйлөм менен кыскача айтып бер."],["Чейректи жыйынтыктоо","Окуган чыгармалардан алган сабакты, жаңы сөздөрдү жана каармандар тууралуу ойду жыйынтыктоо.","Окуган чыгармадан эсте калган каарманды танда. Анын эмне үчүн эсте калганын 5 сүйлөм менен жаз."]];const n=Number(new URLSearchParams(location.search).get("lesson"));if(data[n-1]){const d=data[n-1];document.title=n+"-сабак — "+d[0];document.getElementById("title").textContent=n+"-сабак. "+d[0];document.getElementById("content").innerHTML='<h2>Түшүндүрмө</h2><p>'+d[1]+'</p><h2>Тапшырма</h2><p>'+d[2]+'</p><h2>Окуу жана талдоо</h2><p>Берилген тема боюнча окуу китебиндеги текстти оку. Түшүнүксүз сөздөрдү белгилеп, тексттин негизги оюн өз сөзүң менен айт.</p><h2>Чыгармачылык иш</h2><p>Теманы сүрөт, чакан текст же оозеки баяндоо аркылуу көрсөт.</p><p class="note">Бул иштелме баштапкы методикалык үлгү. Так чыгарма жана китептеги текст берилсе, сабак анын мазмунуна ылайык толукталат.</p>';}else{document.getElementById("content").textContent="Сабак табылган жок.";}</script></body></html>
