<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-класс — Адабий окуу</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f7fb;color:#263445;line-height:1.7}.wrap{width:min(900px,92%);margin:auto}.hero{background:linear-gradient(120deg,#102b50,#20527a);color:#fff;padding:34px 0}.card{background:#fff;border:1px solid #e1e9f0;border-radius:14px;padding:22px;margin:22px 0}h2{color:#102b50}.btn{display:inline-block;padding:10px 15px;border-radius:9px;background:#e8f4ed;color:#16865b;text-decoration:none;font-weight:bold}.actions{display:flex;flex-wrap:wrap;gap:10px}.note{background:#fff7e6;padding:14px;border-radius:8px}.q{border-top:1px solid #e5edf3;padding:12px 0}.q button{margin:5px;padding:8px;border:1px solid #cbd8e4;border-radius:7px;background:white;cursor:pointer}.feedback{font-weight:bold}</style></head><body><header class="wrap" style="padding:18px 0"><a href="3class_adabiy_q2.html">← Сабактардын тизмеси</a> | <a href="3class_adabiy_workbook.html">Жумуш барактары</a></header><section class="hero"><div class="wrap"><h1 id="title">Сабак</h1><p>3-класс • Адабий окуу • 2-чейрек</p></div></section><main class="wrap"><article class="card" id="content"></article><div class="actions"><a class="btn" href="3class_adabiy_q2.html">Бардык сабактар</a></div></main><script>const lessons=[{"name":"Элдик жомоктор дүйнөсү","passage":"Эски дарактын сыры","text":"Айылдын четинде чоң эски алма дарагы өсүп турчу. Анын көлөкөсүнө жайында балдар келип эс алышчу. Бир күнү Айбек дарактын куураган бутактарын көрүп, аларды сындырмак болду. Чоң атасы токтотуп: «Даракка шашпай кам көр. Куураган бутакты туура кесип, түбүнө суу куюп кой», — деди. Айбек чоң атасы менен бутактарды тазалап, түбүнө суу куйду. Күзүндө дарак мол түшүм берди. Айбек табиятты коргоо чоң иш экенин түшүндү.","qs":[{"q":"Дарак кайда өсчү?","opts":["Айылдын четинде","Мектептин ичинде","Деңиз жээгинде"],"ans":"Дарактын мөмөсүн сатып алды"},{"q":"Айбек чоң атасы менен эмне кылды?","opts":["Даракты тазалап, суу куйду","Даракты кыйды","Дарактын мөмөсүн сатып алды"],"ans":"Окуянын негизги сабагы?"},{"q":"Табиятка кам көрүү керек","opts":["Дарактарды сындыруу керек","Суу ичпөө керек",0],"ans":0}]},{"name":"Жакшылык менен жамандык","passage":"Кичинекей жардамчы","text":"Нурбек мектептен келе жатып, жол боюнда оор сумка көтөргөн апаны көрдү. Апасынын жанында кичинекей бала бар эле. Нурбек токтоп, сумканын бир бөлүгүн көтөрүп берүүнү сунуштады. Алар үйгө чейин чогуу барышты. Апасы Нурбекке ыраазы болуп, ал эми бала жылмайып коштошту. Нурбек жардам бергенде өзүнүн да көңүлү көтөрүлгөнүн сезди. Ал жардам берүү үчүн чоң иш жасоо шарт эмес экенин түшүндү.","qs":[{"q":"Нурбек жолдо кимди көрдү?","opts":["Сумка көтөргөн апаны","Мугалимди","Дарыгерди"],"ans":"Үйүн тазалады"},{"q":"Нурбек кандай жардам берди?","opts":["Сумканын бир бөлүгүн көтөрдү","Акча берди","Үйүн тазалады"],"ans":"Текст эмнеге үйрөтөт?"},{"q":"Кичинекей жардам да маанилүү","opts":["Жардам сурабоо керек","Башкаларды көрмөксөн болуу керек",0],"ans":0}]},{"name":"Табиятты сүйүү","passage":"Куштарга кам көрүү","text":"Кыштын күнү кар калың жаады. Асан терезеден бактагы куштарды көрдү. Алар азык издеп жүрүшкөн экен. Асан атасы менен жыгачтан кичинекей жем салгыч жасады. Ага дан салып, даракка илишти. Күн сайын куштар келип жем жей баштады. Асан куштарды алыстан байкап, аларды коркутпады. Ал кышында жаныбарларга жардам берүү керек экенин үйрөндү.","qs":[{"q":"Кайсы мезгил болду?","opts":["Кыш","Жай","Күз"],"ans":"Жалгыз"},{"q":"Асан ким менен жем салгыч жасады?","opts":["Атасы менен","Досу менен","Жалгыз"],"ans":"Асан куштарды эмне кылган жок?"},{"q":"Коркуткан жок","opts":["Азыктандырган жок","Караган жок",0],"ans":0}]},{"name":"Эмгек жана аракет","passage":"Жеңишке жеткен аракет","text":"Мээрим сүрөт тартууну жакшы көрчү, бирок анын сүрөттөрү дайыма эле ойдогудай чыкчу эмес. Ал бир күнү тажап, карандаштарын жыйнап койду. Мугалими ага: «Көнүгүү жасасаң, колуң үйрөнөт», — деди. Мээрим күн сайын он мүнөт сүрөт тартты. Бир айдан кийин анын сүрөттөрү так жана кооз боло баштады. Ал аракет менен чыдамкайлык ийгиликке жеткирерин түшүндү.","qs":[{"q":"Мээрим эмнени жакшы көрчү?","opts":["Сүрөт тартууну","Ырдоону","Чуркоону"],"ans":"Карандашты сындырууну"},{"q":"Мугалим кандай кеңеш берди?","opts":["Күн сайын көнүгүү жасоону","Сүрөттү таштоону","Карандашты сындырууну"],"ans":"Мээрим эмнени түшүндү?"},{"q":"Аракет ийгиликке жеткирет","opts":["Дароо баары даяр болот","Көнүгүү кереги жок",0],"ans":0}]},{"name":"Достук жана ынтымак","passage":"Жоголгон топ","text":"Балдар короодо футбол ойноп жатышты. Топ тосмонун аркы жагына өтүп кетти. Бакыт тосмодон ашып түшүүгө аракет кылды, бирок кооптуу экенин байкады. Досу Эрмек чоңдордон жардам сураууну сунуштады. Алар кошунасына кайрылып, топту алып беришин өтүнүштү. Кошуна топту алып берди. Балдар коопсуз жолду тандаганына кубанышты.","qs":[{"q":"Топ кайда кетти?","opts":["Тосмонун аркы жагына","Көлгө","Мектептин ичине"],"ans":"Мугалим"},{"q":"Ким жардам сунуштады?","opts":["Эрмек","Бакыттын атасы","Мугалим"],"ans":"Балдар эмне кылышты?"},{"q":"Кошунасынан жардам сурашты","opts":["Тосмого чыгышты","Топту таштап кетишти",0],"ans":0}]},{"name":"Макал-лакаптар","passage":"Макалдын мааниси","text":"Айжан «Эмгек түбү — береке» деген макалды чоң энесинен уккан. Чоң энеси бакчада жашылча өстүрчү. Ал жерди даярдап, үрөн сээп, күн сайын сугарды. Бир нече айдан кийин бакчада жашылча мол болду. Айжан макалдын маанисин түшүндү: эмгек кылган адам анын жемишин көрөт. Ал чоң энесине бакчада жардам бере баштады.","qs":[{"q":"Айжан макалды кимден уккан?","opts":["Чоң энесинен","Досунан","Мугалиминен"],"ans":"Дарак гана"},{"q":"Чоң энеси эмне өстүрчү?","opts":["Жашылча","Гүл гана","Дарак гана"],"ans":"Макалдын мааниси?"},{"q":"Эмгек натыйжа берет","opts":["Эмгек кылбоо керек","Береке өзүнөн өзү келет",0],"ans":0}]},{"name":"Ырды көркөм окуу","passage":"Жазгы таң","text":"Таң эрте айыл үстүнө күндүн нурлары төгүлдү. Бактагы чымчыктар сайрап, гүлдөрдүн үстүндө шүүдүрүм жаркырады. Айылдын балдары мектепке баратып, жол боюндагы гүлдөрдү көрүштү. Данияр гүлдөрдү үзбөй, алардын сүрөтүн тартууну сунуштады. Балдар сүрөт тартып, гүлдөрдү өз ордунда калтырышты. Алар табияттын кооздугун байкап, аны сактоо керек экенин сүйлөштү.","qs":[{"q":"Окуя кайсы убакта болду?","opts":["Таң эрте","Түн ортосунда","Кечинде"],"ans":"Бакты тазалоону"},{"q":"Данияр эмне сунуштады?","opts":["Гүлдөрдүн сүрөтүн тартууну","Гүлдөрдү үзүүнү","Бакты тазалоону"],"ans":"Балдар гүлдөрдү эмне кылышты?"},{"q":"Өз ордунда калтырышты","opts":["Үзүп алышты","Сатышты",0],"ans":0}]},{"name":"Кызыктуу окуя","passage":"Күтүлбөгөн белек","text":"Класста Саматтын туулган күнү белгиленди. Ал достору чоң белек алып келет деп ойлогон. Бирок Нурия ага өз колу менен жасаган куттуктоо картасын берди. Картада класстын балдарынын жакшы каалоолору жазылган эле. Самат абдан кубанды. Ал белектин баасы эмес, аны даярдагандагы көңүл жана достук маанилүү экенин түшүндү.","qs":[{"q":"Самат эмнени күттү?","opts":["Туулган күн белегин","Сабакты","Саякатты"],"ans":"Китеп"},{"q":"Нурия эмне берди?","opts":["Кол менен жасалган карта","Оюнчук","Китеп"],"ans":"Самат эмнени түшүндү?"},{"q":"Көңүл жана достук маанилүү","opts":["Белек кымбат болушу керек","Достор кереги жок",0],"ans":0}]},{"name":"Каармандын мүнөзү","passage":"Боорукер коён","text":"Токойдо кичинекей коён жашачу. Бир күнү ал жолдо канаты жаракат алган чымчыкты көрдү. Коён чымчыкты жалбырактардын үстүнө жайгаштырып, токойдогу кары үкүгө алып барды. Үкү чымчыктын жарасын карап, эс алуусуна жардам берди. Бир нече күндөн кийин чымчык кайра учуп кетти. Ал коёнго ыраазычылык айтып, токойго кайтып келди. Коён жардам бергенине кубанды.","qs":[{"q":"Коён кимди көрдү?","opts":["Жаракат алган чымчыкты","Түлкүнү","Балыкты"],"ans":"Карышкырга"},{"q":"Коён чымчыкты кимге алып барды?","opts":["Кары үкүгө","Аюуга","Карышкырга"],"ans":"Чымчык эмне болду?"},{"q":"Кайра учуп кетти","opts":["Токойдон кетпей калды","Жоголду",0],"ans":0}]},{"name":"Сөздөрдүн мааниси","passage":"Сөздөрдү табуу","text":"Китеп окуп жатканда Бекзат «мээримдүү» деген сөзгө жолукту. Ал сөздүн маанисин билбей калды. Сүйлөмдө мээримдүү адам башкаларга кам көрөрү айтылган. Бекзат сөздүн маанисин контексттен түшүндү. Андан кийин сөздүккө карап, «боорукер» деген сөз да мааниси жакын экенин тапты. Ал жаңы сөздү дептерине жазды.","qs":[{"q":"Бекзат кайсы сөзгө жолукту?","opts":["Мээримдүү","Кызыктуу","Күчтүү"],"ans":"Санап"},{"q":"Бекзат сөздүн маанисин кайдан түшүндү?","opts":["Сүйлөмдүн контекстинен","Сүрөттөн гана","Санап"],"ans":"Мээримдүү сөзүнө жакын сөз?"},{"q":"Боорукер","opts":["Караңгы","Узун",0],"ans":0}]},{"name":"Окуганды айтып берүү","passage":"Окуяны баяндоо","text":"Эртең менен Лейла китепканага барды. Ал жаныбарлар тууралуу китеп тандады. Үйүнө келгенде китептен коён жөнүндө кызыктуу бөлүмдү окуп, инисине айтып берди. Иниси да китеп окууга кызыгып, эртеси китепканага барууну сунуштады. Лейла окуганын башкалар менен бөлүшүү жакшы экенин сезди.","qs":[{"q":"Лейла кайда барды?","opts":["Китепканага","Дүкөнгө","Бакчага"],"ans":"Спорт тууралуу"},{"q":"Лейла кандай китеп тандады?","opts":["Жаныбарлар тууралуу","Тарых тууралуу","Спорт тууралуу"],"ans":"Иниси эмнеге кызыкты?"},{"q":"Китеп окууга","opts":["Телевизорго","Уйкуга",0],"ans":0}]},{"name":"Чейректи жыйынтыктоо","passage":"Чейректин белеги","text":"Чейрек аяктаганда мугалим окуучуларга өздөрү окуган китептерден бир каарманды тандап, анын жакшы сапатын айтып берүүнү тапшырды. Көпчүлүк окуучулар боорукер, эмгекчил жана акылдуу каармандарды тандашты. Алар каармандардын аракеттерин мисал кылып көрсөтүштү. Сабак соңунда балдар окуу адамды ойлонууга, жакшы сапаттарды үйрөнүүгө жардам берерин айтышты.","qs":[{"q":"Мугалим кандай тапшырма берди?","opts":["Каарманды жана анын жакшы сапатын айтып берүү","Эсеп чыгаруу","Ыр жаттоо гана"],"ans":"Унутчаак гана"},{"q":"Окуучулар кандай сапаттарды аташты?","opts":["Боорукер, эмгекчил, акылдуу","Жалкоо жана орой","Унутчаак гана"],"ans":"Окуу эмнеге жардам берет?"},{"q":"Ойлонууга жана сапат үйрөнүүгө","opts":["Оюнга гана","Убакыт өткөрүүгө",0],"ans":0}]}];const n=Number(new URLSearchParams(location.search).get("lesson"));const d=lessons[n-1];if(d){document.title=n+"-сабак — "+d.name;document.getElementById("title").textContent=n+"-сабак. "+d.name;let html='<h2>Окуу тексти: '+d.passage+'</h2><p>'+d.text+'</p><h2>Текстти түшүнүү</h2>';d.qs.forEach((q,i)=>{html+='<div class="q"><b>'+(i+1)+'. '+q.q+'</b><br>'+q.opts.map((o,j)=>'<button onclick="answer('+i+','+j+')">'+o+'</button>').join('')+'<div id="f'+i+'" class="feedback"></div></div>'});html+='<h2>Сөздүк иш</h2><p>Тексттен өзүң үчүн жаңы же түшүнүксүз 2 сөздү танда. Алардын маанисин сүйлөмгө карап түшүндүрүүгө аракет кыл.</p><h2>Чыгармачылык тапшырма</h2><p>Тексттин негизги оюн 3–5 сүйлөм менен жаз же сүрөт аркылуу көрсөт.</p><h2>Мугалим үчүн сунуш</h2><p>1) Текстти окуу. 2) Жаңы сөздөрдү талдоо. 3) Суроолорго жооп берүү. 4) Жуп менен талкуулоо. 5) Чыгармачылык иш жана жыйынтык.</p><p class="note">Бул текст — сайт үчүн өз алдынча даярдалган окуу материалы. КТП/окуу китебинин расмий тексти эмес. Тема жана чыгарма берилсе, материал ошол булакка ылайык такталат.</p>';document.getElementById("content").innerHTML=html;window.answer=function(qi,oi){const q=d.qs[qi];const el=document.getElementById("f"+qi);el.textContent=oi===q.ans?"Туура жооп!":"Кайра ойлонуп, текстке кайрыл.";el.style.color=oi===q.ans?"green":"#a45b00";};}else document.getElementById("content").textContent="Сабак табылган жок.";</script></body></html>
