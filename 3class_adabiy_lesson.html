<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-класс — Адабий окуу</title><style>body{font-family:Arial;line-height:1.7;background:#f3f7fb;color:#263445;margin:0}.wrap{width:min(900px,92%);margin:auto}.hero{background:#153c63;color:white;padding:30px 0}.card{background:white;border-radius:12px;padding:20px;margin:20px 0}.q{padding:12px;border-top:1px solid #ddd}.q button{margin:5px;padding:8px}.note{background:#fff7e6;padding:12px}</style></head><body><header class="wrap" style="padding:18px"><a href="3class_adabiy_q2.html">← Сабактар</a> | <a href="3class_adabiy_workbook.html">Жумуш барактары</a></header><section class="hero"><div class="wrap"><h1 id="title">Сабак</h1></div></section><main class="wrap"><article class="card" id="content"></article></main><script>const lessons=[{"title":"Жомок","heading":"Дарак","passage":"Айбек даракка суу куюп, куураган бутактарын чоң атасы менен тазалады.","qs":[{"q":"Дарак кайда?","opts":["Айылда","Барактын түсү","Көл"],"answer":0},{"q":"Айбек эмне кылды?","opts":["Тазалап, суу куйду","Термометр","Сан"],"answer":0},{"q":"Сабак?","opts":["Табиятты сактоо","Карта","Үй"],"answer":0}]},{"title":"Жардам","heading":"Нурбек","passage":"Нурбек оор сумка көтөргөн апага жардам берип, үйүнө чейин коштоп барды.","qs":[{"q":"Кимге жардам?","opts":["Апасына","Барактын түсү","Көл"],"answer":0},{"q":"Кандай жардам?","opts":["Сумка көтөрдү","Термометр","Сан"],"answer":0},{"q":"Сабак?","opts":["Жардам маанилүү","Карта","Үй"],"answer":0}]},{"title":"Табият","heading":"Куштар","passage":"Асан кышында куштарга жем салгыч жасап, дан салды.","qs":[{"q":"Мезгил?","opts":["Кыш","Барактын түсү","Көл"],"answer":0},{"q":"Ким менен?","opts":["Атасы","Термометр","Сан"],"answer":0},{"q":"Эмне салды?","opts":["Дан","Карта","Үй"],"answer":0}]},{"title":"Эмгек","heading":"Мээрим","passage":"Мээрим күн сайын сүрөт тартып машыгып, бир айдан кийин ийгиликке жетти.","qs":[{"q":"Эмнеге машыкты?","opts":["Сүрөткө","Барактын түсү","Көл"],"answer":0},{"q":"Качан жакшы болду?","opts":["Бир айда","Термометр","Сан"],"answer":0},{"q":"Ой?","opts":["Аракет","Карта","Үй"],"answer":0}]},{"title":"Достук","heading":"Топ","passage":"Топ тосмонун ары жагына кетти. Балдар кошунадан жардам сурашты.","qs":[{"q":"Топ кайда?","opts":["Тосмонун ары","Барактын түсү","Көл"],"answer":0},{"q":"Ким жардам берди?","opts":["Кошуна","Термометр","Сан"],"answer":0},{"q":"Балдар эмне кылды?","opts":["Жардам сурашты","Карта","Үй"],"answer":0}]},{"title":"Макал","heading":"Бакча","passage":"Айжан чоң энесине бакчада жардам берип, эмгектин жемишин көрдү.","qs":[{"q":"Кимге жардам?","opts":["Чоң энесине","Барактын түсү","Көл"],"answer":0},{"q":"Эмне өстү?","opts":["Жашылча","Термометр","Сан"],"answer":0},{"q":"Макал?","opts":["Эмгек жемиш берет","Карта","Үй"],"answer":0}]},{"title":"Ыр","heading":"Таң","passage":"Таңда чымчыктар сайрады. Балдар гүлдөрдүн сүрөтүн тартып, гүлдөрдү үзбөй коюшту.","qs":[{"q":"Качан?","opts":["Таң","Барактын түсү","Көл"],"answer":0},{"q":"Балдар эмне кылды?","opts":["Сүрөт тартты","Термометр","Сан"],"answer":0},{"q":"Гүлдөр?","opts":["Үзгөн жок","Карта","Үй"],"answer":0}]},{"title":"Окуя","heading":"Карта","passage":"Нурия Саматка өз колу менен куттуктоо картасын берди. Самат достуктын маанисин түшүндү.","qs":[{"q":"Ким берди?","opts":["Нурия","Барактын түсү","Көл"],"answer":0},{"q":"Белек?","opts":["Карта","Термометр","Сан"],"answer":0},{"q":"Ой?","opts":["Достук","Карта","Үй"],"answer":0}]},{"title":"Каарман","heading":"Коён","passage":"Коён жаракат алган чымчыкты үкүгө алып барып жардам берди.","qs":[{"q":"Коён кимге жардам?","opts":["Чымчык","Барактын түсү","Көл"],"answer":0},{"q":"Ким карады?","opts":["Үкү","Термометр","Сан"],"answer":0},{"q":"Коён кандай?","opts":["Боорукер","Карта","Үй"],"answer":0}]},{"title":"Сөз","heading":"Мээримдүү","passage":"Бекзат мээримдүү сөзүн контексттен түшүнүп, боорукер деген жакын сөздү тапты.","qs":[{"q":"Кайсы сөз?","opts":["Мээримдүү","Барактын түсү","Көл"],"answer":0},{"q":"Кайдан түшүндү?","opts":["Контекст","Термометр","Сан"],"answer":0},{"q":"Жакын сөз?","opts":["Боорукер","Карта","Үй"],"answer":0}]},{"title":"Баяндоо","heading":"Китеп","passage":"Лейла китепканада жаныбарлар тууралуу китеп окуп, инисине айтып берди.","qs":[{"q":"Кайда?","opts":["Китепкана","Барактын түсү","Көл"],"answer":0},{"q":"Кандай китеп?","opts":["Жаныбарлар","Термометр","Сан"],"answer":0},{"q":"Иниси?","opts":["Окууга кызыкты","Карта","Үй"],"answer":0}]},{"title":"Жыйынтык","heading":"Каарман","passage":"Окуучулар каармандарды тандап, боорукерлик жана эмгекчилдик сапаттарын айтып беришти.","qs":[{"q":"Эмнени тандашты?","opts":["Каармандар","Барактын түсү","Көл"],"answer":0},{"q":"Кандай сапат?","opts":["Боорукерлик","Термометр","Сан"],"answer":0},{"q":"Окуу эмнеге?","opts":["Үйрөнүүгө","Карта","Үй"],"answer":0}]}];const n=Number(new URLSearchParams(location.search).get("lesson"));const d=lessons[n-1];if(d){document.getElementById("title").textContent=n+"-сабак: "+d.title;let h='<h2>'+d.heading+'</h2><p>'+d.passage+'</p><h2>Текстти түшүнүү</h2>';d.qs.forEach((q,i)=>h+='<div class="q"><b>'+q.q+'</b><br>'+q.opts.map((o,j)=>'<button onclick="check('+i+','+j+')">'+o+'</button>').join('')+'<div id="f'+i+'"></div></div>');h+='<h2>Сөздүк иш</h2><p>2 жаңы сөздү тандап, маанисин жаз.</p><h2>Чыгармачылык иш</h2><p>Окуяны 3 сүйлөм менен баянда же сүрөт тарт.</p><h2>Мугалимге</h2><p>Окуу, сөздүк иш, суроолор, талкуу, жыйынтык.</p><p class="note">Бул кыска автордук электрондук материал. КТП жана китепке дал келиши текшериле элек.</p>';document.getElementById("content").innerHTML=h;window.check=(qi,oi)=>{let el=document.getElementById("f"+qi);el.textContent=oi===d.qs[qi].answer?"Туура жооп!":"Кайра аракет кыл.";el.style.color=oi===d.qs[qi].answer?"green":"#a45b00";};}else document.getElementById("content").textContent="Сабак табылган жок.";</script></body></html>
